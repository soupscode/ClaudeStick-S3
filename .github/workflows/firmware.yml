# Builds the StickS3 firmware on every push and publishes the web flasher to GitHub Pages.
# One-time: repo Settings -> Pages -> Source: "GitHub Actions".
name: firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Hook, installer, mock-device and firmware-logic tests (the firmware runs on the host against stand-ins).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography   # the CA-bundle test parses certificates
      - name: Tests
        # On failure, surface the tail of the test output as an annotation (readable via the API/UI summary).
        run: |
          set -o pipefail
          tests/run_all.sh --no-browser 2>&1 | tee test.log || {
            msg=$(tail -n 60 test.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=tests failed::$msg"
            exit 1
          }

  browser-tests:
    # Setup wizard and phone page in headless Chromium. Informational: it doesn't block publishing.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Tests (browser)
        # On failure, surface the tail of the test output as an annotation (readable via the API/UI summary).
        run: |
          set -o pipefail
          tests/run_all.sh --browser-only 2>&1 | tee browser.log || {
            msg=$(tail -n 80 browser.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=browser tests failed::$msg"
            exit 1
          }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio "esptool<5"
      - name: Build firmware + web flasher
        # On failure, surface the tail of the build output as an annotation (readable via the API/UI summary).
        run: |
          set -o pipefail
          ./tools/build_web.sh 2>&1 | tee build.log || {
            msg=$(tail -n 60 build.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build failed::$msg"
            exit 1
          }
        env:
          # Bake the Pages URL in so the Stick's settings page can update itself.
          CS_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Opt-in telemetry destination (docs/TELEMETRY.md): only set if this repo (or its owner) has a
          # CS_TELEMETRY_URL repository/organization variable. Empty by default, including for every fork.
          CS_TELEMETRY_URL: ${{ vars.CS_TELEMETRY_URL }}
      - name: Verify release (OTA metadata, partition table, hashes)
        # Fails the build, and so blocks the deploy, if an over-the-air update would be broken.
        run: python3 tools/verify_release.py
        env:
          CS_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          CS_TELEMETRY_URL: ${{ vars.CS_TELEMETRY_URL }}
      - name: Build report (size + compiler warnings)
        if: always()
        run: |
          [ -f build.log ] || exit 0
          sizes=$(grep -E '^(RAM|Flash):' build.log | sed 's/\r//g; s/%/%25/g' | paste -sd' ' -)
          nwarn=$(grep -cE '^(src|firmware/src)/.*warning:' build.log || true)
          echo "::notice title=firmware size::$sizes; warnings in firmware/src: $nwarn"
          { echo "### Firmware build"; grep -E '^(RAM|Flash):' build.log || true; echo; echo "warnings in firmware/src: $nwarn"; } >> "$GITHUB_STEP_SUMMARY"
          w=$(grep -E '^(src|firmware/src)/.*warning:' build.log | sort -u | head -40 | sed 's/\r//g; s/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$w" ]; then echo "::warning title=compiler warnings (firmware/src)::$w"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: claudestick-firmware
          path: |
            web/firmware/claudestick.bin
            web/firmware/claudestick-app.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    # Only publishes from main, and only when the build, release checks and tests all passed.
    needs: [build, test]
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
