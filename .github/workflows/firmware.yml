# Builds the StickS3 firmware on every push and publishes the web flasher to GitHub Pages.
# One-time: repo Settings -> Pages -> Source: "GitHub Actions".
name: firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio "esptool<5"
      - run: ./tools/build_web.sh
        env:
          # Bake the Pages URL in so the Stick's settings page can update itself.
          CS_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: claudestick-firmware
          path: |
            web/firmware/claudestick.bin
            web/firmware/claudestick-app.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
