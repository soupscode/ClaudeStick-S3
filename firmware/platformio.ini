; ClaudeStick firmware for M5Stack StickS3 (K150)
; Build:  pio run          Flash:  pio run -t upload       Logs: pio device monitor
[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:embed_files.py
; Mozilla root CAs for HTTPS update checks (regenerate: tools/gen_ca_bundle.sh)
board_build.embed_files = data/cert/x509_crt_bundle.bin
lib_deps =
    m5stack/M5Unified @ ^0.2.29
    bblanchon/ArduinoJson @ ^7.0.0
